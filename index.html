<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кіру — Firebase Auth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main class="card">
    <div class="logo">🔥 FIREBASE AUTH</div>
    <h1>Жүйеге кіру</h1>
    <p class="subtitle">Email мен құпиясөзді енгізіңіз</p>

    <div id="message" class="message"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>

      <label for="password">Құпиясөз</label>
      <input type="password" id="password" name="password" required>
      <a class="forgot" href="reset.html">Құпиясөзді ұмыттыңыз ба?</a>

      <button type="submit" class="btn-primary">Кіру</button>
    </form>

    <div class="divider">немесе</div>
    <button id="google-btn" class="btn-google">Google арқылы кіру</button>

    <p class="links">Аккаунтыңыз жоқ па? <a href="register.html">Тіркелу</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
