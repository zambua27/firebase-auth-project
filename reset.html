<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Құпиясөзді қалпына келтіру — Firebase Auth</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reset">
  <main class="card">
    <div class="logo">🔥 FIREBASE AUTH</div>
    <h1>Құпиясөзді қалпына келтіру</h1>
    <p class="subtitle">Тіркелген email-ді енгізіңіз — оған сілтеме жібереміз</p>

    <div id="message" class="message"></div>

    <form id="reset-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@mail.com" required>
      <button type="submit" class="btn-primary">Сілтеме жіберу</button>
    </form>

    <p class="links"><a href="index.html">← Кіру бетіне оралу</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
